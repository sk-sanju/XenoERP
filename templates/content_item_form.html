{% extends 'base.html' %}
{% block title %}{{ title }} - XenoCRM{% endblock %}

{% block content %}
<div class="p-4 sm:p-6 space-y-6 bg-slate-50 min-h-screen">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header Block -->
    <div class="flex items-center gap-2 text-xs text-outline font-semibold mb-1">
      <a href="{% url 'content_tracker' %}" class="hover:text-primary transition-colors">Content Tracker</a>
      <span class="material-symbols-outlined text-[12px]">chevron_right</span>
      <span class="text-primary">{{ title }}</span>
    </div>
    
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h2 class="font-headline-lg text-headline-lg font-bold text-on-background">{{ title }}</h2>
        <p class="text-secondary text-body-sm mt-1">Fill out the information below to configure client content and publishing tracks.</p>
      </div>
    </div>

    <!-- Form Card -->
    <div class="glass-card rounded-3xl border border-outline-variant/30 shadow-sm bg-white p-6 md:p-8">
      <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        {% csrf_token %}
        
        <!-- Client (Required) -->
        <div>
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Client *</label>
          <select name="client_id" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary">
            <option value="" disabled {% if not form_data.client_id %}selected{% endif %}>Select Client...</option>
            {% for client in clients %}
            <option value="{{ client.id }}" {% if form_data.client_id == client.id|stringformat:"i" or form_data.client_id == client.id %}selected{% endif %}>{{ client.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Title (Required) -->
        <div>
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Video Title *</label>
          <input type="text" name="video_title" value="{{ form_data.video_title|default:'' }}" required placeholder="e.g. 5 Productivity Tips Reel" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary"/>
        </div>

        <!-- Editor -->
        <div>
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Editor</label>
          <select name="editor_id" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary">
            <option value="">Unassigned</option>
            {% for editor in editors %}
            <option value="{{ editor.id }}" {% if form_data.editor_id == editor.id|stringformat:"i" or form_data.editor_id == editor.id %}selected{% endif %}>{{ editor.user.get_full_name|default:editor.user.username }} ({{ editor.role }})</option>
            {% endfor %}
          </select>
        </div>



        <!-- Status -->
        <div>
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Status</label>
          <select name="status" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary">
            <option value="Pending" {% if form_data.status == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="Editing" {% if form_data.status == 'Editing' %}selected{% endif %}>Editing</option>
            <option value="Review" {% if form_data.status == 'Review' %}selected{% endif %}>Review</option>
            <option value="Approved" {% if form_data.status == 'Approved' %}selected{% endif %}>Approved</option>
            <option value="Published" {% if form_data.status == 'Published' %}selected{% endif %}>Published</option>
            <option value="Rejected" {% if form_data.status == 'Rejected' %}selected{% endif %}>Rejected</option>
            <option value="Scheduled" {% if form_data.status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
          </select>
        </div>

        <!-- Priority -->
        <div>
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Priority</label>
          <select name="priority" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary">
            <option value="Low" {% if form_data.priority == 'Low' %}selected{% endif %}>Low</option>
            <option value="Medium" {% if form_data.priority == 'Medium' or not form_data.priority %}selected{% endif %}>Medium</option>
            <option value="High" {% if form_data.priority == 'High' %}selected{% endif %}>High</option>
            <option value="Urgent" {% if form_data.priority == 'Urgent' %}selected{% endif %}>Urgent</option>
          </select>
        </div>

        <!-- Dates -->
        <div>
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Date Received</label>
          <input type="date" name="date_received" value="{{ form_data.date_received|default:'' }}" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary"/>
        </div>
        <div>
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Due Date</label>
          <input type="date" name="due_date" value="{{ form_data.due_date|default:'' }}" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary"/>
        </div>

        <!-- Notes -->
        <div class="md:col-span-2">
          <label class="block text-label-md font-label-md text-outline uppercase mb-1">Notes</label>
          <textarea name="notes" rows="4" placeholder="Add specific editing, transitions, or copy instructions..." class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-body-sm focus:ring-1 focus:ring-primary focus:border-primary">{{ form_data.notes|default:'' }}</textarea>
        </div>

        <!-- Footer Actions -->
        <div class="md:col-span-2 flex justify-end gap-3 pt-6 border-t border-outline-variant/20">
          <a href="{% url 'content_tracker' %}" class="px-4 py-2 border border-outline-variant text-secondary rounded-lg hover:bg-slate-50 transition-all">Cancel</a>
          <button type="submit" class="px-5 py-2 bg-primary text-on-primary font-button rounded-lg shadow hover:opacity-90 active:scale-95 transition-all">Save Changes</button>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
